# Isolated scratch target. Production volumes are never referenced.
services:
  restore-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: sammlerraum_restore_test
      POSTGRES_USER: restore_test
      POSTGRES_PASSWORD: ${RESTORE_TEST_PASSWORD:?Set a local disposable password}
    ports:
      - "127.0.0.1:${RESTORE_TEST_PORT:-15433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restore_test -d sammlerraum_restore_test"]
      interval: 2s
      timeout: 3s
      retries: 20
