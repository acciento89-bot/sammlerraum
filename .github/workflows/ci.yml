name: CI

on:
  push:
    branches: ["main", "work/sammlerraum-v1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/sammlerraum_test
      APP_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_APP_ORIGIN: https://example.invalid
      UPLOADS_DIR: /tmp/sammlerraum-test-uploads
      MONEY_AUTHORING_ENABLED: "true"
      LOG_LEVEL: info
      WORKER_HEALTH_PORT: "3001"
      BETTER_AUTH_SECRET: test-only-secret-that-is-at-least-thirty-two-characters
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      APPLE_CLIENT_ID: test-apple-client-id
      APPLE_CLIENT_SECRET: test-apple-client-secret
      SMTP_HOST: smtp.example.invalid
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: test-smtp-user
      SMTP_PASSWORD: test-smtp-password
      SMTP_FROM: noreply@example.invalid
      POSTGRES_DB: sammlerraum_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: sammlerraum_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d sammlerraum_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sammlerraum/db prisma generate
      - name: Apply PostgreSQL migrations
        run: pnpm --filter @sammlerraum/db prisma migrate deploy
      - name: Install independent PDF verification tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm test
      - name: Lint workspace
        id: lint
        run: pnpm lint
      - name: Capture exact Task 7 formatting diff
        if: ${{ failure() && steps.lint.outcome == 'failure' }}
        run: |
          pnpm --filter @sammlerraum/web exec prettier --write \
            src/app/globals.css \
            'src/app/[locale]/(app)/collections/page.tsx' \
            'src/app/[locale]/(app)/collections/[collectionId]/page.tsx' \
            'src/app/[locale]/(app)/items/new/page.tsx' \
            'src/app/[locale]/(app)/items/[itemId]/page.tsx' \
            src/components/collections/collections-manager.tsx \
            src/components/collections/collection-detail.tsx \
            src/components/items/item-form.tsx \
            src/components/items/item-form-values.ts \
            src/components/items/item-form-values.test.ts \
            src/components/items/code-scanner.tsx \
            e2e/collections-items.spec.ts \
            messages/de.json \
            messages/en.json
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFile } from "node:fs/promises";
          const allowed = new Set([
            "apps/web/src/app/globals.css",
            "apps/web/src/app/[locale]/(app)/collections/page.tsx",
            "apps/web/src/app/[locale]/(app)/collections/[collectionId]/page.tsx",
            "apps/web/src/app/[locale]/(app)/items/new/page.tsx",
            "apps/web/src/app/[locale]/(app)/items/[itemId]/page.tsx",
            "apps/web/src/components/collections/collections-manager.tsx",
            "apps/web/src/components/collections/collection-detail.tsx",
            "apps/web/src/components/items/item-form.tsx",
            "apps/web/src/components/items/item-form-values.ts",
            "apps/web/src/components/items/item-form-values.test.ts",
            "apps/web/src/components/items/code-scanner.tsx",
            "apps/web/e2e/collections-items.spec.ts",
            "apps/web/messages/de.json",
            "apps/web/messages/en.json",
          ]);
          const changed = execFileSync("git", ["diff", "--name-only", "--", "apps/web"], {
            encoding: "utf8",
          })
            .trim()
            .split("\n")
            .filter((file) => allowed.has(file));
          for (const file of changed) {
            const content = await readFile(file);
            console.log(JSON.stringify({ file, base64: content.toString("base64") }));
          }
          NODE
      - run: pnpm typecheck
      - name: Build workspace
        env:
          NODE_ENV: production
        run: pnpm build
      - name: Run real database health and pg-boss singleton integration tests
        run: >-
          RUN_DATABASE_INTEGRATION=1 pnpm vitest run --no-file-parallelism
          packages/domain/src/imports/import-workflow.integration.test.ts
          apps/web/src/lib/import-routes.integration.test.ts
          packages/domain/src/exports/artifact-access.integration.test.ts
          apps/web/src/lib/transfer-routes.integration.test.ts
          apps/worker/src/jobs/import-source-cleanup.integration.test.ts
          apps/worker/src/jobs/private-artifact-expiry.integration.test.ts
          packages/db/src/postgres.integration.test.ts
          packages/db/src/media-migration.integration.test.ts
          packages/db/src/media-lock.integration.test.ts
          packages/queue/src/postgres.integration.test.ts
          apps/worker/src/jobs/image-repository.integration.test.ts
          packages/domain/src/identity/profile-service.test.ts
          packages/domain/src/identity/security-service.test.ts
          packages/domain/src/collections/collection-service.test.ts
          packages/domain/src/items/item-service.test.ts
          packages/domain/src/media/media-service.test.ts
          packages/domain/src/media/cleanup-service.test.ts
          packages/storage/src/staging-lock.integration.test.ts
          packages/domain/src/media/media-read.integration.test.ts
          packages/domain/src/media/media-management.integration.test.ts
          packages/domain/src/items/identifier-service.test.ts
          packages/domain/src/custom-fields/custom-field-service.test.ts
          packages/domain/src/catalog/category-template-service.integration.test.ts
          packages/domain/src/catalog/catalog-service.integration.test.ts
          packages/domain/src/catalog/item-catalog-link.test.ts
          packages/domain/src/catalog/catalog-read-service.test.ts
          packages/domain/src/catalog/catalog-history-service.test.ts
          packages/domain/src/catalog/initialize-catalog.test.ts
          apps/web/src/lib/catalog-history-routes.integration.test.ts
          apps/web/src/lib/catalog-link-routes.integration.test.ts
          packages/domain/src/catalog/proposal-service.test.ts
          packages/domain/src/condition/condition-service.test.ts
          packages/domain/src/grading/grading-service.test.ts
          packages/domain/src/collaboration/membership-service.test.ts
          packages/domain/src/collaboration/management-service.test.ts
          packages/domain/src/community
          packages/domain/src/moderation
          packages/domain/src/notifications
          apps/web/src/lib/social-routes.integration.test.ts
          apps/web/src/lib/comment-routes.integration.test.ts
          apps/worker/src/jobs/send-email.integration.test.ts
          packages/domain/src/wishlist/wishlist-service.test.ts
          packages/domain/src/collaboration/item-authoring-service.test.ts
          packages/domain/src/collaboration/collection-authoring-service.test.ts
          apps/web/src/lib/collaboration-management-routes.integration.test.ts
          packages/domain/src/collaboration/invitation-service.test.ts
          apps/web/src/lib/invitation-routes.integration.test.ts
          packages/domain/src/sharing/share-service.test.ts
          packages/domain/src/audit/audit-service.test.ts
          packages/domain/src/audit/restore-service.test.ts
          apps/web/src/lib/restore-routes.integration.test.ts
          packages/domain/src/audit/core-audit-integration.test.ts
          apps/web/src/lib/share-routes.integration.test.ts
          packages/domain/src/valuations/valuation-service.test.ts
          packages/domain/src/valuations/valuation-query.test.ts
          packages/domain/src/market-data/market-batch.integration.test.ts
          packages/domain/src/market-data/market-aggregate.integration.test.ts
          packages/domain/src/search/market-filter.integration.test.ts
          packages/domain/src/search/duplicate-filter.integration.test.ts
          packages/domain/src/search/legacy-money-query.integration.test.ts
          packages/domain/src/search/legacy-money-query.test.ts
          packages/domain/src/money/purchase-cost.test.ts
          packages/domain/src/money/money-transfer.integration.test.ts
          packages/domain/src/imports/import-service.integration.test.ts
          apps/worker/src/jobs/import-parser.integration.test.ts
          apps/worker/src/jobs/commit-import.test.ts
          packages/domain/src/exports/export-service.integration.test.ts
          packages/domain/src/insurance/insurance-service.test.ts
          packages/domain/src/reports/report-service.integration.test.ts
          apps/worker/src/jobs/insurance-report.integration.test.ts
          apps/web/src/lib/insurance-report-routes.integration.test.ts
          apps/worker/src/jobs/tabular-export.integration.test.ts
          packages/db/src/import-jobs.integration.test.ts
          apps/web/src/lib/legacy-money-query-routes.integration.test.ts
          packages/domain/src/dashboard/dashboard-service.test.ts
          packages/domain/src/dashboard/personal-milestone-service.test.ts
          packages/db/src/legacy-money.integration.test.ts
          packages/domain/src/money/legacy-money-store.test.ts
          packages/db/src/author-correction.integration.test.ts
          packages/domain/src/money/personal-money-service.test.ts
          apps/web/src/lib/legacy-money-routes.integration.test.ts
          packages/db/src/test-database.test.ts
          packages/domain/src/catalog/catalog-money-submission.test.ts
          packages/domain/src/catalog/catalog-money-map.test.ts
          packages/domain/src/catalog/catalog-money-mutation.test.ts
          packages/domain/src/catalog/catalog-money-proposals.test.ts
          packages/domain/src/catalog/catalog-money-service.test.ts
          apps/web/src/lib/catalog-money-routes.integration.test.ts
          apps/web/src/lib/personal-milestone-routes.integration.test.ts
          apps/web/src/lib/dashboard-routes.integration.test.ts
          packages/domain/src/search/smart-collection-service.test.ts
          apps/web/src/lib/smart-collection-routes.integration.test.ts
          packages/domain/src/search/item-search-service.test.ts
          packages/domain/src/sharing/share-read-access.test.ts
          packages/domain/src/search/scoped-read-budget.test.ts
          packages/domain/src/search/scoped-read-context.test.ts
          packages/domain/src/search/scoped-search-service.test.ts
          packages/domain/src/search/scoped-consumers.test.ts
          packages/domain/src/search/scoped-performance.integration.test.ts
          apps/web/src/lib/scoped-search-routes.integration.test.ts
          packages/domain/src/search/search-reference-service.integration.test.ts
          apps/web/src/lib/search-reference-routes.integration.test.ts
          packages/domain/src/search/search-read.integration.test.ts
          packages/domain/src/search/search-retained-integrity.integration.test.ts
          apps/web/src/lib/item-search-routes.integration.test.ts
          apps/web/src/lib/private-search-routes.integration.test.ts
          apps/web/src/lib/valuation-routes.integration.test.ts
          packages/domain/src/market-data/market-data-service.test.ts apps/worker/src/jobs/market-sync.integration.test.ts
          apps/worker/src/jobs/market-request-permit.integration.test.ts
          apps/worker/src/jobs/production-market.integration.test.ts
          apps/web/src/lib/grading-routes.integration.test.ts
          apps/web/src/lib/condition-routes.integration.test.ts
          apps/web/src/lib/catalog-proposal-routes.integration.test.ts
          packages/domain/src/locations/location-service.test.ts
          apps/web/src/lib/security-service.integration.test.ts
          apps/web/src/app/api/v1/items/resource-route.integration.test.ts
      - name: Install Chromium for authentication journeys
        run: pnpm --filter @sammlerraum/web exec playwright install --with-deps chromium
      # All browser suites exercise the same production build without dev compilation.
      - name: Run storage label browser journeys against production
        run: >-
          RUN_AUTH_E2E=1 RUN_PRODUCTION_E2E=1 pnpm --filter @sammlerraum/web exec playwright test
          e2e/location-labels.spec.ts --workers=1
      - name: Run actual collection invitation cookie-session API journey
        run: >-
          RUN_AUTH_E2E=1 RUN_PRODUCTION_E2E=1 pnpm --filter @sammlerraum/web exec playwright test
          e2e/collaboration-api.spec.ts --project=collaboration-api --workers=1
      - name: Run actual granular sharing browser and cookie-session journeys
        run: >-
          RUN_AUTH_E2E=1 RUN_PRODUCTION_E2E=1 pnpm --filter @sammlerraum/web exec playwright test
          e2e/sharing.spec.ts --project=sharing-desktop --project=sharing-mobile --workers=1
      - name: Run actual import, export and insurance browser journeys
        run: >-
          RUN_IMPORT_E2E=1 RUN_AUTH_E2E=1 RUN_PRODUCTION_E2E=1 pnpm --filter @sammlerraum/web exec playwright test
          e2e/import-report.spec.ts --workers=1
      - name: Run protected media browser journey against production
        run: >-
          RUN_MEDIA_E2E=1 RUN_AUTH_E2E=1 RUN_PRODUCTION_E2E=1 pnpm --filter @sammlerraum/web exec playwright test
          e2e/media-read.spec.ts e2e/media-documents.spec.ts --workers=1
      - name: Run catalog and grading browser journeys against production
        run: >-
          RUN_AUTH_E2E=1 RUN_PRODUCTION_E2E=1 pnpm --filter @sammlerraum/web exec playwright test
          e2e/catalog-grading.spec.ts --workers=1
      - name: Run immutable catalog money browser lifecycle in an owned disposable database
        run: |
          set -euo pipefail
          export PGPASSWORD=test
          createdb -h localhost -U test sammlerraum_m4_browser_20261106_test
          trap 'dropdb -h localhost -U test sammlerraum_m4_browser_20261106_test' EXIT
          export DATABASE_URL=postgresql://test:test@localhost:5432/sammlerraum_m4_browser_20261106_test
          pnpm --filter @sammlerraum/db exec prisma migrate deploy
          RUN_CATALOG_MONEY_E2E=1 RUN_MONEY_UI_E2E=1 RUN_AUTH_E2E=1 RUN_PRODUCTION_E2E=1 pnpm --filter @sammlerraum/web exec playwright test e2e/catalog-money-api.spec.ts e2e/catalog-money-ui.spec.ts e2e/legacy-money.spec.ts --workers=1
          MONEY_CANONICAL_CONSUMERS_ENABLED=true RUN_MONEY_CONSUMERS_E2E=1 RUN_AUTH_E2E=1 RUN_PRODUCTION_E2E=1 pnpm --filter @sammlerraum/web exec playwright test e2e/money-consumers.spec.ts --workers=1
      - name: Run private valuations and ingestion-generated external transport rendering against production
        run: >-
          RUN_AUTH_E2E=1 RUN_PRODUCTION_E2E=1 pnpm --filter @sammlerraum/web exec playwright test
          e2e/valuations.spec.ts --workers=1
      - name: Run authentication browser journeys against production
        run: >-
          RUN_AUTH_E2E=1 RUN_PRODUCTION_E2E=1 pnpm --filter @sammlerraum/web exec playwright test
          e2e/auth.spec.ts
      - name: Run collection and item browser journeys against production
        run: >-
          RUN_AUTH_E2E=1 RUN_PRODUCTION_E2E=1 pnpm --filter @sammlerraum/web exec playwright test
          e2e/collections-items.spec.ts --workers=1
      - name: Run private search browser journeys against production
        run: |
          set -euo pipefail
          export PGPASSWORD=test
          createdb -h localhost -U test sammlerraum_m4_browser_20261106_test
          trap 'dropdb -h localhost -U test sammlerraum_m4_browser_20261106_test' EXIT
          export DATABASE_URL=postgresql://test:test@localhost:5432/sammlerraum_m4_browser_20261106_test
          pnpm --filter @sammlerraum/db exec prisma migrate deploy
          RUN_AUTH_E2E=1 RUN_PRODUCTION_E2E=1 pnpm --filter @sammlerraum/web exec playwright test e2e/search-dashboard.spec.ts e2e/personal-milestone-api.spec.ts e2e/personal-milestones.spec.ts --workers=1
      - run: bash scripts/verify-compose.sh
      - run: docker build -f Dockerfile.web --build-arg NEXT_PUBLIC_APP_ORIGIN=https://example.invalid .
      - run: docker build -f Dockerfile.worker -t sammlerraum-worker-ci .
      - name: Decode with Sharp in the final worker image
        run: >-
          docker run --rm --entrypoint node sammlerraum-worker-ci -e
          "const sharp=require('sharp'); sharp({create:{width:3,height:2,channels:3,background:'red'}}).webp().toBuffer().then(bytes=>sharp(bytes).raw().toBuffer({resolveWithObject:true})).then(({info})=>{if(info.width!==3||info.height!==2)process.exit(1)}).catch(()=>process.exit(1))"

      - name: Verify compiled community cookie API
        env:
          RUN_AUTH_E2E: "1"
          RUN_PRODUCTION_E2E: "1"
          RUN_IMPORT_E2E: "0"
        run: >-
          pnpm --filter @sammlerraum/web exec playwright test
          e2e/community-api.spec.ts --project=community-api --workers=1
      - name: Verify community wishes notifications and moderation in desktop and mobile browsers
        env:
          RUN_AUTH_E2E: "1"
          RUN_PRODUCTION_E2E: "1"
          RUN_IMPORT_E2E: "0"
          MONEY_AUTHORING_ENABLED: "true"
        run: >-
          pnpm --filter @sammlerraum/web exec playwright test
          e2e/community.spec.ts e2e/public-profile.spec.ts --project=community-ui-desktop --project=community-ui-mobile --workers=1
      - name: Verify collaboration management and restoration in desktop and mobile browsers
        run: >-
          RUN_AUTH_E2E=1 RUN_PRODUCTION_E2E=1 pnpm --filter @sammlerraum/web exec playwright test
          e2e/collaboration-sharing.spec.ts e2e/collaboration-management.spec.ts
          --project=collaboration-ui-desktop --project=collaboration-ui-mobile --workers=1

      - name: Verify scoped shared-search cookie privacy and responsive repair
        env:
          RUN_AUTH_E2E: "1"
          RUN_PRODUCTION_E2E: "1"
          RUN_IMPORT_E2E: "0"
          MONEY_AUTHORING_ENABLED: "true"
        run: >-
          pnpm --filter @sammlerraum/web exec playwright test
          e2e/scoped-search.spec.ts --project=desktop --project=mobile --workers=1

      - name: Verify private photo analysis against actual PostgreSQL and fake provider transport
        env:
          RUN_DATABASE_INTEGRATION: "1"
        run: >-
          pnpm exec vitest run packages/domain/src/ai packages/contracts/src/ai.test.ts
          packages/ai/src/openai-provider.test.ts apps/worker/src/jobs/analyze-item.test.ts
          apps/worker/src/jobs/ai-analysis-dispatcher.test.ts apps/web/src/lib/ai-routes.test.ts
          apps/web/src/lib/ai-capture-routes.test.ts --maxWorkers=1
      - name: Verify compiled photo analysis confirmation in both languages and screen sizes
        env:
          RUN_AUTH_E2E: "1"
          RUN_PRODUCTION_E2E: "1"
          RUN_AI_E2E: "1"
          RUN_IMPORT_E2E: "0"
          RUN_MEDIA_E2E: "0"
          AI_ANALYSIS_ENABLED: "true"
          AI_OPENAI_API_KEY: fixture-not-a-real-key
          AI_OPENAI_MODEL: fixture-vision
          AI_MONTHLY_REQUEST_LIMIT: "3"
        run: >-
          pnpm --filter @sammlerraum/web exec playwright test e2e/ai-capture.spec.ts e2e/ai-catalog-review.spec.ts
          --project=ai-desktop --project=ai-mobile --workers=1

      - name: Verify local billing ownership, lifecycle, quotas and public metadata
        env:
          RUN_DATABASE_INTEGRATION: "1"
        run: >-
          pnpm exec vitest run packages/domain/src/billing packages/billing
          packages/contracts/src/billing.test.ts packages/config/src/billing.test.ts
          packages/config/src/billing-isolation.test.ts apps/web/src/lib/billing-routes.test.ts
          apps/web/src/lib/billing-webhook-route.test.ts apps/web/src/lib/billing-status-route.test.ts
          apps/web/src/lib/billing-price-cache.test.ts apps/web/src/components/billing/billing-locale-navigation.test.ts
          apps/worker/src/jobs/billing-sync.test.ts apps/worker/src/main.test.ts apps/worker/src/run-wiring.test.ts --maxWorkers=1
      - name: Verify compiled billing in both languages and screen sizes with offline SDK transport
        env:
          RUN_AUTH_E2E: "1"
          RUN_PRODUCTION_E2E: "1"
          RUN_BILLING_E2E: "1"
          RUN_IMPORT_E2E: "0"
          RUN_MEDIA_E2E: "0"
          BILLING_ENVIRONMENT: test
          BILLING_ENABLED: "true"
          # Deliberately invalid synthetic credentials; preload refuses any other key.
          STRIPE_SECRET_KEY: sk_test_sammlerraum_offline_fixture
          STRIPE_WEBHOOK_SECRET: whsec_synthetic_offline_only
          STRIPE_PREMIUM_MONTHLY_PRICE_ID: price_monthly_fixture
          STRIPE_PREMIUM_YEARLY_PRICE_ID: price_yearly_fixture
        run: >-
          pnpm --filter @sammlerraum/web exec playwright test e2e/billing.spec.ts
          --project=billing-desktop --project=billing-mobile --workers=1
