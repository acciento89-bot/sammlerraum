name: CI

on:
  push:
    branches: ["main", "work/sammlerraum-v1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/sammlerraum_test
      APP_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_APP_ORIGIN: https://example.invalid
      UPLOADS_DIR: /tmp/sammlerraum-test-uploads
      LOG_LEVEL: info
      WORKER_HEALTH_PORT: "3001"
      BETTER_AUTH_SECRET: test-only-secret-that-is-at-least-thirty-two-characters
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      APPLE_CLIENT_ID: test-apple-client-id
      APPLE_CLIENT_SECRET: test-apple-client-secret
      SMTP_HOST: smtp.example.invalid
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: test-smtp-user
      SMTP_PASSWORD: test-smtp-password
      SMTP_FROM: noreply@example.invalid
      POSTGRES_DB: sammlerraum_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: sammlerraum_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d sammlerraum_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sammlerraum/db prisma generate
      - name: Apply PostgreSQL migrations
        run: pnpm --filter @sammlerraum/db prisma migrate deploy
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Build workspace
        env:
          NODE_ENV: production
        run: pnpm build
      - name: Run real database health and pg-boss singleton integration tests
        run: >-
          RUN_DATABASE_INTEGRATION=1 pnpm vitest run
          packages/db/src/postgres.integration.test.ts
          packages/queue/src/postgres.integration.test.ts
          packages/domain/src/identity/profile-service.test.ts
      - run: bash scripts/verify-compose.sh
      - run: docker build -f Dockerfile.web --build-arg NEXT_PUBLIC_APP_ORIGIN=https://example.invalid .
      - run: docker build -f Dockerfile.worker .
